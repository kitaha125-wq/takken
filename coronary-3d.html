<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="冠動脈3D">
<meta name="theme-color" content="#0c1a22">
<title>冠動脈解剖 3Dラーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c1a22;
  --bg-soft: #132833;
  --panel: rgba(14, 28, 38, 0.92);
  --ink: #e8f0f4;
  --muted: #8aa0ad;
  --line: rgba(232, 240, 244, 0.12);
  --accent: #d64545;
  --rca: #e85d4c;
  --lad: #3db8a8;
  --lcx: #5b8fd9;
  --lmt: #e6b84d;
  --focus: #ffe08a;
  --ok: #5ecf8a;
  --bad: #f07178;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "BIZ UDPGothic", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 700px at 70% 10%, rgba(61, 184, 168, 0.12), transparent 55%),
    radial-gradient(900px 600px at 10% 80%, rgba(214, 69, 69, 0.14), transparent 50%),
    linear-gradient(160deg, #08141b 0%, #0c1a22 45%, #122a36 100%);
  -webkit-tap-highlight-color: transparent;
}
#app {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
}
#viewport {
  position: absolute;
  inset: 0;
  z-index: 0;
}
#viewport canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

.topbar {
  position: relative;
  z-index: 4;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: calc(12px + var(--safe-top)) 16px 10px;
  pointer-events: none;
}
.brand {
  pointer-events: auto;
  max-width: min(420px, 58vw);
  flex: 1 1 auto;
}
.brand-kicker {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--muted);
  margin-bottom: 4px;
}
.brand h1 {
  font-family: "Shippori Mincho", serif;
  font-size: clamp(22px, 4.5vw, 34px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: 0.02em;
}
.brand p {
  margin-top: 6px;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}
.top-actions {
  pointer-events: auto;
  position: relative;
  z-index: 5;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
  flex: 0 0 auto;
}
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(19, 40, 51, 0.85);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}
.btn:hover { background: rgba(30, 56, 70, 0.95); }
.btn:active { transform: scale(0.98); }
.btn.active {
  border-color: rgba(230, 184, 77, 0.55);
  background: rgba(230, 184, 77, 0.16);
  color: var(--focus);
}
.btn.primary {
  background: var(--accent);
  border-color: transparent;
  color: #fff;
}

.hud {
  position: relative;
  z-index: 2;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 0 12px 12px;
  height: 100%;
  min-height: 0;
}
.mode-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.mode-tabs .btn {
  flex: 1;
  text-align: center;
}
.panel {
  pointer-events: auto;
  position: relative;
  z-index: 3;
  width: min(360px, 92vw);
  max-height: min(62vh, 560px);
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  animation: panelIn 0.45s ease both;
}
@keyframes panelIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.panel h2 {
  font-family: "Shippori Mincho", serif;
  font-size: 18px;
  margin-bottom: 4px;
}
.abbr {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 8px;
}
.desc {
  font-size: 13px;
  line-height: 1.7;
  color: #c9d7df;
  margin-bottom: 12px;
}
.meta {
  display: grid;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
}
.meta strong { color: var(--ink); font-weight: 700; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip {
  appearance: none;
  font: inherit;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  background: transparent;
  cursor: pointer;
}
.chip.rca { color: #ffb4a8; border-color: rgba(232, 93, 76, 0.45); }
.chip.lad { color: #9be8dc; border-color: rgba(61, 184, 168, 0.45); }
.chip.lcx { color: #a8c8ff; border-color: rgba(91, 143, 217, 0.45); }
.chip.lmt { color: #ffe29a; border-color: rgba(230, 184, 77, 0.45); }
.chip.on {
  background: rgba(255, 255, 255, 0.08);
  color: var(--ink);
}

.list-title {
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 4px 0 8px;
}
.artery-list {
  display: grid;
  gap: 6px;
}
.artery-btn {
  appearance: none;
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: rgba(255,255,255,0.03);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  padding: 9px 10px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.artery-btn:hover { background: rgba(255,255,255,0.06); }
.artery-btn.selected {
  border-color: rgba(255, 224, 138, 0.45);
  background: rgba(255, 224, 138, 0.08);
}
.swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: 0 0 auto;
}
.artery-btn small {
  margin-left: auto;
  color: var(--muted);
  font-size: 11px;
}

.legend {
  pointer-events: auto;
  align-self: flex-end;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(14, 28, 38, 0.72);
  border: 1px solid var(--line);
  font-size: 11px;
  color: var(--muted);
}
.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; }

.bottombar {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 14px calc(10px + var(--safe-bottom));
  background: linear-gradient(to top, rgba(8, 20, 27, 0.92), transparent);
  pointer-events: none;
}
.hint {
  pointer-events: none;
  font-size: 12px;
  color: var(--muted);
}
.bottom-actions {
  pointer-events: auto;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.quiz-box {
  margin-top: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.quiz-q {
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 10px;
}
.quiz-choices {
  display: grid;
  gap: 6px;
}
.choice {
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.04);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  text-align: left;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
}
.choice:hover { background: rgba(255,255,255,0.07); }
.choice.correct { border-color: rgba(94, 207, 138, 0.7); background: rgba(94, 207, 138, 0.12); }
.choice.wrong { border-color: rgba(240, 113, 120, 0.7); background: rgba(240, 113, 120, 0.12); }
.quiz-feedback {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
  min-height: 1.2em;
}
.score {
  font-size: 12px;
  color: var(--focus);
  margin-bottom: 6px;
}

#loader {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  background: #0c1a22;
  transition: opacity 0.4s ease;
}
#loader.hide { opacity: 0; pointer-events: none; }
.loader-inner { text-align: center; }
.loader-title {
  font-family: "Shippori Mincho", serif;
  font-size: 28px;
  margin-bottom: 8px;
}
.loader-bar {
  width: 72px;
  height: 3px;
  margin: 18px auto 0;
  background: var(--accent);
  transform-origin: left center;
  animation: loadPulse 1.1s ease-in-out infinite;
}
@keyframes loadPulse {
  0%, 100% { transform: scaleX(0.35); opacity: 0.45; }
  50% { transform: scaleX(1); opacity: 1; }
}

@media (max-width: 820px) {
  .hud {
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-end;
  }
  .legend {
    flex-direction: row;
    flex-wrap: wrap;
    align-self: stretch;
    margin-bottom: 8px;
  }
  .panel {
    width: 100%;
    max-height: 42vh;
  }
  .brand p { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="viewport" aria-label="冠動脈の3Dビュー"></div>

  <div id="loader">
    <div class="loader-inner">
      <div class="loader-title">冠動脈解剖</div>
      <div style="color:var(--muted);font-size:13px;letter-spacing:0.12em">3D LEARNING</div>
      <div class="loader-bar" id="loaderBar"></div>
      <p id="loaderMsg" style="display:none;margin-top:18px;max-width:280px;font-size:13px;line-height:1.6;color:#ffb4a8"></p>
      <button id="loaderRetry" type="button" class="btn primary" style="display:none;margin:16px auto 0">再読み込み</button>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-kicker">CORONARY ANATOMY</div>
      <h1>冠動脈解剖 3D</h1>
      <p>心臓表面を走る主要枝を回転・拡大して学べます。枝を選ぶと走行と灌流域がハイライトされます。</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnExplore" type="button">探索</button>
      <button class="btn" id="btnQuiz" type="button">クイズ</button>
      <button class="btn" id="btnAuto" type="button">自動回転</button>
    </div>
  </header>

  <div class="hud">
    <aside class="panel" id="infoPanel">
      <div class="mode-tabs" role="tablist" aria-label="学習モード">
        <button class="btn active" id="btnExplorePanel" type="button" role="tab" aria-selected="true">探索</button>
        <button class="btn" id="btnQuizPanel" type="button" role="tab" aria-selected="false">クイズ</button>
      </div>
      <div class="chip-row" id="systemChips"></div>
      <h2 id="infoTitle">全体を見る</h2>
      <div class="abbr" id="infoAbbr">RCA · LAD · LCx</div>
      <p class="desc" id="infoDesc">画面をドラッグして回転、ピンチ／ホイールで拡大。左の枝リスト、または3D上の血管をタップすると詳細が出ます。</p>
      <div class="meta" id="infoMeta"></div>
      <div id="exploreSection">
        <div class="list-title">主要枝</div>
        <div class="artery-list" id="arteryList"></div>
      </div>
      <div class="quiz-box" id="quizBox" hidden>
        <div class="score" id="quizScore">正解 0 / 0</div>
        <div class="quiz-q" id="quizQ"></div>
        <div class="quiz-choices" id="quizChoices"></div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <button class="btn primary" id="quizNext" type="button" style="margin-top:10px;width:100%">次の問題</button>
      </div>
    </aside>

    <div class="legend" aria-hidden="true">
      <div class="legend-row"><span class="dot" style="background:var(--lmt)"></span>LMT 左主幹部</div>
      <div class="legend-row"><span class="dot" style="background:var(--lad)"></span>LAD 前下行枝</div>
      <div class="legend-row"><span class="dot" style="background:var(--lcx)"></span>LCx 回旋枝</div>
      <div class="legend-row"><span class="dot" style="background:var(--rca)"></span>RCA 右冠動脈</div>
    </div>
  </div>

  <footer class="bottombar">
    <div class="hint" id="hintText">ドラッグで回転 · ピンチでズーム · 血管をタップ</div>
    <div class="bottom-actions">
      <button class="btn" id="btnReset" type="button">視点リセット</button>
      <button class="btn" id="btnHeart" type="button">心筋を薄く</button>
      <a class="btn" href="./start.html" style="text-decoration:none">スタートへ</a>
    </div>
  </footer>
</div>

<script>
(function () {
  var msg = document.getElementById("loaderMsg");
  var bar = document.getElementById("loaderBar");
  var retry = document.getElementById("loaderRetry");
  function fail(text) {
    if (bar) bar.style.display = "none";
    if (msg) { msg.style.display = "block"; msg.textContent = text; }
    if (retry) {
      retry.style.display = "block";
      retry.onclick = function () { location.reload(); };
    }
  }
  window.__coronaryFail = fail;
  var urls = [
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"
  ];
  var i = 0;
  function loadNext() {
    if (i >= urls.length) {
      fail("3Dライブラリを読めませんでした。ネット接続を確認して再読み込みしてください。");
      return;
    }
    var s = document.createElement("script");
    s.src = urls[i++];
    s.async = true;
    s.onload = function () {
      if (!window.THREE) { loadNext(); return; }
      try { window.__startCoronary3D(); }
      catch (err) {
        console.error(err);
        fail("表示に失敗しました。再読み込みを試してください。");
      }
    };
    s.onerror = loadNext;
    document.head.appendChild(s);
  }
  setTimeout(function () {
    if (!window.THREE) fail("読み込みが遅いです。通信状況を確認するか、再読み込みしてください。");
  }, 12000);
  loadNext();
})();
</script>

const OVERVIEW = {

const state = {
  mode: "explore", // explore | quiz

const viewport = document.getElementById("viewport");
if (!viewport) throw new Error("viewport missing");

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(viewport.clientWidth || window.innerWidth, viewport.clientHeight || window.innerHeight);
if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, (viewport.clientWidth || 1) / Math.max(viewport.clientHeight || 1, 1), 0.1, 100);
camera.position.set(2.8, 1.4, 3.4);

/** OrbitControls 非依存の簡易カメラ操作（iPhone向け） */
const controls = {
  target: new THREE.Vector3(0, 0.05, 0),
  minDistance: 2.2,
  maxDistance: 7,
  autoRotate: true,
  autoRotateSpeed: 0.55,
  damping: 0.08,
  spherical: new THREE.Spherical().setFromVector3(camera.position.clone().sub(new THREE.Vector3(0, 0.05, 0))),
  _velTheta: 0,
  _velPhi: 0,
  _dragging: false,
  _lastX: 0,
  _lastY: 0,
  _pinchStart: 0,
  _distStart: 0,
  update() {
    if (this.autoRotate && !this._dragging) this.spherical.theta -= 0.0055 * this.autoRotateSpeed;
    this.spherical.theta += this._velTheta;
    this.spherical.phi += this._velPhi;
    this._velTheta *= 1 - this.damping;
    this._velPhi *= 1 - this.damping;
    this.spherical.phi = Math.max(0.2, Math.min(Math.PI - 0.2, this.spherical.phi));
    this.spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this.spherical.radius));
    const offset = new THREE.Vector3().setFromSpherical(this.spherical);
    camera.position.copy(this.target).add(offset);
    camera.lookAt(this.target);
  },
  reset() {
    this.target.set(0, 0.05, 0);
    camera.position.set(2.8, 1.4, 3.4);
    this.spherical.setFromVector3(camera.position.clone().sub(this.target));
    this._velTheta = 0;
    this._velPhi = 0;
  },
};
controls.spherical.setFromVector3(camera.position.clone().sub(controls.target));

(function bindOrbit(el) {
  el.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch" && e.isPrimary === false) return;
    controls._dragging = true;
    controls._lastX = e.clientX;
    controls._lastY = e.clientY;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
  });
  el.addEventListener("pointermove", (e) => {
    if (!controls._dragging) return;
    const dx = e.clientX - controls._lastX;
    const dy = e.clientY - controls._lastY;
    controls._lastX = e.clientX;
    controls._lastY = e.clientY;
    controls.spherical.theta -= dx * 0.005;
    controls.spherical.phi -= dy * 0.005;
    controls._velTheta = -dx * 0.0008;
    controls._velPhi = -dy * 0.0008;
  });
  function endDrag(e) {
    controls._dragging = false;
    try { el.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
  el.addEventListener("wheel", (e) => {
    e.preventDefault();
    controls.spherical.radius *= e.deltaY > 0 ? 1.08 : 0.92;
  }, { passive: false });
  el.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      const a = e.touches[0], b = e.touches[1];
      controls._pinchStart = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      controls._distStart = controls.spherical.radius;
      controls._dragging = false;
    }
  }, { passive: true });
  el.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2 && controls._pinchStart) {
      const a = e.touches[0], b = e.touches[1];
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      controls.spherical.radius = controls._distStart * (controls._pinchStart / Math.max(dist, 1));
    }
  }, { passive: true });
})(renderer.domElement);

scene.add(new THREE.AmbientLight(0xb8d0dc, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.15);
key.position.set(3, 4, 2);

const fill = new THREE.DirectionalLight(0x7eb8c9, 0.45);
fill.position.set(-3, 1, -2);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffc9b5, 0.35);

const root = new THREE.Group();

function makeHeart() {
  const group = new THREE.Group();
  const mat = new THREE.MeshPhysicalMaterial({
    color: COLORS.heart,
    roughness: 0.55,
    metalness: 0.05,
    clearcoat: 0.25,
    transparent: true,
    opacity: 0.72,
    side: THREE.DoubleSide,
  });

  const left = new THREE.Mesh(new THREE.SphereGeometry(0.95, 48, 48), mat);
  left.scale.set(1.05, 1.2, 0.95);
  left.position.set(-0.35, 0.05, 0.05);
  group.add(left);

  const right = new THREE.Mesh(new THREE.SphereGeometry(0.78, 48, 48), mat.clone());
  right.scale.set(0.95, 1.05, 0.9);
  right.position.set(0.42, 0.12, 0.0);
  group.add(right);

  const apex = new THREE.Mesh(new THREE.ConeGeometry(0.85, 1.35, 48), mat.clone());
  apex.rotation.x = Math.PI;
  apex.position.set(-0.05, -0.85, 0.05);
  apex.scale.set(1.05, 1, 0.95);
  group.add(apex);

  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.55, 0.7, 0.35, 32),
    new THREE.MeshStandardMaterial({ color: 0x6e3038, roughness: 0.7, transparent: true, opacity: 0.65 })
  );
  base.position.set(0.05, 1.15, 0.15);
  group.add(base);

  // 大動脈起始の目印
  const aorta = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.26, 0.55, 24),
    new THREE.MeshStandardMaterial({ color: 0xc45a5a, roughness: 0.45 })
  );
  aorta.position.set(0.08, 1.45, 0.35);
  aorta.rotation.x = 0.25;
  group.add(aorta);

  group.userData.materials = [];
  group.traverse((o) => {
    if (o.isMesh && o.material) group.userData.materials.push(o.material);
  });
  return group;
}

function tubeFromPoints(points, radius, color) {
  const vecs = points.map((p) => new THREE.Vector3(...p));
  const curve = new THREE.CatmullRomCurve3(vecs);
  const geo = new THREE.TubeGeometry(curve, 64, radius, 12, false);
  const mat = new THREE.MeshPhysicalMaterial({
    color,
    roughness: 0.35,
    metalness: 0.15,
    clearcoat: 0.4,
    emissive: color,
    emissiveIntensity: 0.08,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.curve = curve;
  return mesh;
}

const heart = makeHeart();
root.add(heart);

const arteryMeshes = new Map();
const pickables = [];

ARTERIES.forEach((a) => {
  const mesh = tubeFromPoints(a.points, a.radius, a.color);
  mesh.userData.arteryId = a.id;
  mesh.userData.baseColor = a.color;
  root.add(mesh);
  arteryMeshes.set(a.id, mesh);
  pickables.push(mesh);

  // クリックしやすい見えないヒット領域（やや太め）
  const hit = tubeFromPoints(a.points, a.radius * 2.2, a.color);
  hit.material = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
  hit.userData.arteryId = a.id;
  hit.userData.isHit = true;
  root.add(hit);
  pickables.push(hit);
});

root.rotation.y = -0.35;
root.position.y = 0.05;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setSelected(id, { fromQuiz = false } = {}) {
  state.selectedId = id;
  const selectedSystem = id ? ARTERIES.find((x) => x.id === id)?.system : null;
  arteryMeshes.forEach((mesh, aid) => {
    const selected = aid === id;
    const sameSystem = selectedSystem && ARTERIES.find((x) => x.id === aid)?.system === selectedSystem;
    const mat = mesh.material;
    if (!id) {
      mat.color.setHex(mesh.userData.baseColor);
      mat.emissive.setHex(mesh.userData.baseColor);
      mat.emissiveIntensity = 0.12;
      mat.opacity = 1;
      mat.transparent = false;
    } else if (selected) {
      mat.color.setHex(COLORS.highlight);
      mat.emissive.setHex(0xffcc55);
      mat.emissiveIntensity = 0.55;
      mat.opacity = 1;
      mat.transparent = false;
    } else if (sameSystem) {
      mat.color.setHex(mesh.userData.baseColor);
      mat.emissive.setHex(mesh.userData.baseColor);
      mat.emissiveIntensity = 0.22;
      mat.opacity = 0.95;
      mat.transparent = true;
    } else {
      mat.color.setHex(COLORS.dim);
      mat.emissive.setHex(0x000000);
      mat.emissiveIntensity = 0;
      mat.transparent = true;
      mat.opacity = 0.18;
    }
    mat.needsUpdate = true;
  });
  updateInfoPanel();
  if (!fromQuiz) renderArteryList();
}

function updateInfoPanel() {
  const chips = document.getElementById("systemChips");
  const title = document.getElementById("infoTitle");
  const abbr = document.getElementById("infoAbbr");
  const desc = document.getElementById("infoDesc");
  const meta = document.getElementById("infoMeta");

  if (state.mode === "quiz") {
    chips.innerHTML = `<span class="chip">クイズモード</span>`;
    return;
  }

  const a = ARTERIES.find((x) => x.id === state.selectedId);
  if (!a) {
    chips.innerHTML = `
      <button type="button" class="chip rca" data-focus="rca">RCA系</button>
      <button type="button" class="chip lad" data-focus="lad">LAD系</button>
      <button type="button" class="chip lcx" data-focus="lcx">LCx系</button>
      <button type="button" class="chip lmt" data-focus="lmt">LMT</button>`;
    title.textContent = OVERVIEW.name;
    abbr.textContent = OVERVIEW.abbr;
    desc.textContent = OVERVIEW.desc;
    meta.innerHTML = OVERVIEW.meta.map(([k, v]) => `<div><strong>${k}</strong> · ${v}</div>`).join("");
    return;
  }

  chips.innerHTML = `
    <button type="button" class="chip ${a.system} on" data-focus="${a.system}">${a.system.toUpperCase()}</button>
    <button type="button" class="chip" data-focus="all">全体</button>`;
  title.textContent = a.name;
  abbr.textContent = a.abbr;
  desc.textContent = a.tip;
  meta.innerHTML = `
    <div><strong>灌流域</strong> · ${a.territory}</div>
    <div><strong>主な供給</strong> · ${a.supplies}</div>`;
}

function focusSystem(system) {
  if (!system || system === "all") {
    setSelected(null);
    return;
  }
  const first = ARTERIES.find((a) => a.system === system);
  if (first) setSelected(first.id);
}

function renderArteryList() {
  const list = document.getElementById("arteryList");
  if (state.mode === "quiz") {
    list.hidden = true;
    return;
  }
  list.hidden = false;
  list.innerHTML = ARTERIES.map((a) => {
    const selected = state.selectedId === a.id ? "selected" : "";
    const hex = "#" + a.color.toString(16).padStart(6, "0");
    return `<button type="button" class="artery-btn ${selected}" data-id="${a.id}">
      <span class="swatch" style="background:${hex}"></span>
      <span>${a.name}</span>
      <small>${a.abbr.split(" ")[0]}</small>
    </button>`;
  }).join("");
}

function setMode(mode) {
  state.mode = mode;
  const exploreOn = mode === "explore";
  ["btnExplore", "btnExplorePanel"].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle("active", exploreOn);
    el.setAttribute("aria-selected", exploreOn ? "true" : "false");
  });
  ["btnQuiz", "btnQuizPanel"].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle("active", !exploreOn);
    el.setAttribute("aria-selected", !exploreOn ? "true" : "false");
  });
  document.getElementById("quizBox").hidden = mode !== "quiz";
  document.getElementById("exploreSection").hidden = mode === "quiz";
  document.getElementById("hintText").textContent =
    mode === "quiz"
      ? "ハイライトされた血管はどの枝？"
      : "ドラッグで回転 · ピンチでズーム · 血管をタップ";

  if (mode === "quiz") {
    state.quiz = { index: 0, correct: 0, total: 0, answered: false, order: shuffle(ARTERIES.map((a) => a.id)) };
    document.getElementById("infoTitle").textContent = "クイズ";
    document.getElementById("infoAbbr").textContent = "ハイライト枝を当てる";
    document.getElementById("infoDesc").textContent = "3Dで光っている血管の名前を選んでください。";
    document.getElementById("infoMeta").innerHTML = "";
    document.getElementById("systemChips").innerHTML = `<span class="chip">クイズモード</span>`;
    nextQuiz(true);
  } else {
    setSelected(state.selectedId);
    renderArteryList();
    updateInfoPanel();
  }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nextQuiz(resetFeedback = false) {
  const q = state.quiz;
  if (q.index >= q.order.length) {
    q.order = shuffle(ARTERIES.map((a) => a.id));
    q.index = 0;
  }
  q.answered = false;
  const id = q.order[q.index];
  const answer = ARTERIES.find((a) => a.id === id);
  setSelected(id, { fromQuiz: true });

  document.getElementById("quizScore").textContent = `正解 ${q.correct} / ${q.total}`;
  document.getElementById("quizQ").textContent = "ハイライトされている血管の名前は？";
  document.getElementById("quizFeedback").textContent = resetFeedback ? "" : "";

  const distractors = shuffle(ARTERIES.filter((a) => a.id !== id)).slice(0, 3);
  const choices = shuffle([answer, ...distractors]);
  const box = document.getElementById("quizChoices");
  box.innerHTML = choices
    .map(
      (c) =>
        `<button type="button" class="choice" data-id="${c.id}">${c.name} <span style="color:var(--muted);font-size:11px">(${c.abbr.split(" ")[0]})</span></button>`
    )
    .join("");
}

function onQuizChoice(id) {
  const q = state.quiz;
  if (q.answered) return;
  q.answered = true;
  q.total += 1;
  const correctId = q.order[q.index];
  const ok = id === correctId;
  if (ok) q.correct += 1;

  document.querySelectorAll(".choice").forEach((el) => {
    const cid = el.getAttribute("data-id");
    if (cid === correctId) el.classList.add("correct");
    else if (cid === id) el.classList.add("wrong");
  });

  const ans = ARTERIES.find((a) => a.id === correctId);
  document.getElementById("quizFeedback").textContent = ok
    ? `正解。${ans.tip}`
    : `不正解。正解は「${ans.name}」。${ans.tip}`;
  document.getElementById("quizScore").textContent = `正解 ${q.correct} / ${q.total}`;
  q.index += 1;
}

function pickFromEvent(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if (!hits.length) return null;
  return hits[0].object.userData.arteryId || null;
}

let pointerDown = null;
renderer.domElement.addEventListener("pointerdown", (e) => {
  pointerDown = { x: e.clientX, y: e.clientY, id: e.pointerId };
});
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!pointerDown || pointerDown.id !== e.pointerId) return;
  const dx = e.clientX - pointerDown.x;
  const dy = e.clientY - pointerDown.y;
  pointerDown = null;
  if (Math.hypot(dx, dy) > 8) return;
  if (state.mode === "quiz") return;
  const id = pickFromEvent(e.clientX, e.clientY);
  if (id) setSelected(id);
});

document.getElementById("arteryList").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-id]");
  if (!btn) return;
  setSelected(btn.getAttribute("data-id"));
});

document.getElementById("systemChips").addEventListener("click", (e) => {
  const chip = e.target.closest("[data-focus]");
  if (!chip || state.mode === "quiz") return;
  focusSystem(chip.getAttribute("data-focus"));
});

document.getElementById("quizChoices").addEventListener("click", (e) => {
  const btn = e.target.closest(".choice");
  if (!btn) return;
  onQuizChoice(btn.getAttribute("data-id"));
});

document.getElementById("quizNext").addEventListener("click", () => nextQuiz(true));
function bindMode(id, mode) {
  const el = document.getElementById(id);
  if (el) el.addEventListener("click", () => setMode(mode));
}
bindMode("btnExplore", "explore");
bindMode("btnExplorePanel", "explore");
bindMode("btnQuiz", "quiz");
bindMode("btnQuizPanel", "quiz");
document.getElementById("btnAuto").addEventListener("click", () => {
  state.autoRotate = !state.autoRotate;
  controls.autoRotate = state.autoRotate;
  document.getElementById("btnAuto").classList.toggle("active", state.autoRotate);
});
document.getElementById("btnReset").addEventListener("click", () => {
  controls.reset();
  if (state.mode === "explore") setSelected(null);
});
document.getElementById("btnHeart").addEventListener("click", () => {
  state.heartTransparent = !state.heartTransparent;
  const opacity = state.heartTransparent ? 0.22 : 0.72;
  heart.userData.materials.forEach((m) => {
    m.opacity = opacity;
    m.transparent = true;
  });
  document.getElementById("btnHeart").classList.toggle("active", state.heartTransparent);
  document.getElementById("btnHeart").textContent = state.heartTransparent ? "心筋を戻す" : "心筋を薄く";
});

function onResize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener("resize", onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  // ごく弱い心拍っぽい脈動
  const t = performance.now() * 0.001;
  const pulse = 1 + Math.sin(t * 2.2) * 0.008;
  heart.scale.setScalar(pulse);
  renderer.render(scene, camera);
}

document.getElementById("btnAuto").classList.add("active");
document.getElementById("btnExplore").classList.add("active");
renderArteryList();
updateInfoPanel();
setSelected(null);
animate();
onResize();
requestAnimationFrame(() => {
  const loader = document.getElementById("loader");
  if (loader) loader.classList.add("hide");
});
}; // end __startCoronary3D
</script>
