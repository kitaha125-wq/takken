<style>
:root {
  --bg: #1a2332; --bg2: #243044; --card: #2a3a52; --text: #f0f3f7; --muted: #9aadc4;

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  line-height: 1.55; -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100dvh;
  padding-bottom: calc(88px + env(safe-area-inset-bottom));
  background:
    radial-gradient(110% 70% at 0% -5%, rgba(224,122,106,.14), transparent 50%),
    radial-gradient(90% 55% at 100% 0%, rgba(232,165,75,.12), transparent 45%),
    var(--bg);
}
header {
  position: sticky; top: 0; z-index: 30;
  background: linear-gradient(180deg, #152033 0%, rgba(26,35,50,.97) 100%);
  border-bottom: 1px solid var(--line);
  padding: 12px 0 8px;
  backdrop-filter: blur(8px);
}
.header-inner { padding: 0 16px; }
h1 { margin: 0; font-size: 1.12rem; letter-spacing: .02em; }
.sub { color: var(--muted); font-size: .76rem; margin-top: 3px; }
.sub a { color: var(--accent2); text-decoration: none; }
.chips {
  display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px 2px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg2);
  color: var(--muted); border-radius: 999px; padding: 7px 12px; font-size: .74rem;
  cursor: pointer; min-height: 36px; touch-action: manipulation;
}
.chip.active {
  background: var(--accent); color: #1a2332; border-color: transparent; font-weight: 800;
}
.chip.mode.active {
  background: rgba(94,184,168,.16); color: var(--accent2);
  border-color: var(--accent2); font-weight: 700;
}
.progress-wrap { padding: 0 16px 8px; max-width: 760px; margin: 0 auto; }
.progress {
  height: 5px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden;
}
.progress > i { display: block; height: 100%; width: 0%; background: var(--accent2); transition: width .2s; }
.prog-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .7rem; margin-top: 4px; }
main { max-width: 760px; margin: 0 auto; padding: 8px 16px 24px; }
.hint {
  color: var(--muted); font-size: .78rem; margin: 0 0 12px;

}
.hint strong { color: var(--accent); font-weight: 700; }
.method {
  font-size: .72rem; color: var(--muted); margin: 0 0 14px; padding-left: 1.1em;
}
.method li { margin: .25em 0; }
.toc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.toc a {
  display: block; text-decoration: none; color: var(--text);
  background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; font-size: .82rem; font-weight: 700;
}
.toc a span { display: block; color: var(--muted); font-size: .68rem; font-weight: 500; margin-top: 2px; }
.toc a.gyo { border-left: 3px solid var(--gyo); }
.toc a.ken { border-left: 3px solid var(--ken); }
.toc a.hou { border-left: 3px solid var(--hou); }
.toc a.zei { border-left: 3px solid var(--zei); }
.sec { display: none; margin-bottom: 22px; }
.sec.show { display: block; }
.sec-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 8px; margin: 6px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
}
.sec-head h2 { margin: 0; font-size: 1.05rem; }
.sec-head .tag {
  font-size: .68rem; padding: 3px 8px; border-radius: 999px;
  background: rgba(224,122,106,.16); color: #f0b4aa;
}
.block {
  background: linear-gradient(155deg, #2f425a, #243447 75%);
  border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 8px;
  margin-bottom: 10px;
}
.block h3 {
  margin: 0 0 8px; font-size: .88rem; color: var(--accent);
  display: flex; align-items: center; gap: 6px;
}
.block h3 .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--danger); flex: 0 0 auto;
}
.row {
  display: grid; grid-template-columns: 1fr auto; gap: 8px;
  padding: 8px 0; border-top: 1px solid var(--line); align-items: start;
}
.row:first-of-type { border-top: 0; }
.row label.check {
  display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start;
  cursor: pointer; margin: 0;
}
.row input[type=checkbox] {
  margin-top: 3px; accent-color: var(--accent2); width: 16px; height: 16px;
}
.row.done .k, .row.done .v { opacity: .45; }
.k { font-size: .84rem; color: #e8eef5; }
.v {
  font-size: .84rem; font-weight: 800; color: var(--accent);
  text-align: right; white-space: nowrap; min-width: 4.5em;
}
.trap {
  grid-column: 1 / -1; font-size: .72rem; color: var(--danger);
  margin: -2px 0 2px 26px;
}
.trap::before { content: "⚠ "; }
.hook {
  grid-column: 1 / -1;
  font-size: .76rem; color: #b8ebe1;
  background: rgba(94,184,168,.1); border: 1px solid rgba(94,184,168,.22);
  border-radius: 8px; padding: 7px 10px; margin: 2px 0 4px 26px;
}
.meta-line {
  grid-column: 1 / -1; font-size: .65rem; color: var(--muted); margin: 0 0 2px 26px;
}
.nums-only .trap, .nums-only .hook, .nums-only .meta-line { display: none !important; }
.trap-only .hook, .trap-only .meta-line { display: none !important; }
.trap-only .row:not(.has-trap) { display: none; }
footer.bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: rgba(21,32,51,.96); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 8px; justify-content: center;

footer.bar button, footer.bar a {
  flex: 1; max-width: 200px; text-align: center; text-decoration: none;
  border: 0; border-radius: 12px; padding: 12px; font-weight: 800; font-size: .86rem;

.btn-primary { background: var(--accent); color: #1a2332; }
.btn-ghost { background: var(--bg2); color: var(--text); border: 1px solid var(--line) !important; }
.hidden { display: none !important; }
@supports not (height: 100dvh) { body { min-height: 100vh; } }
@media (min-width: 640px) { .toc { grid-template-columns: repeat(4, 1fr); } }
</style>

可", "hook": "遺贈も登記勝負", "meta": "50% · corr+check"}, {"k": "買主 vs 不法占拠者", "v": "登記なしで返還請求可", "trap": "賃借人は対抗要件がないと原則不可", "hook": "所有権は強い／賃借権は対抗要件", "meta": "review · review"}, {"k": "悪意の不法行為と相殺", "v": "加害者から不可", "trap": "被害者から相殺するのは可", "hook": "加害者からは相殺できない", "meta": "0% · review"}, {"k": "連帯債務の混同", "v": "絶対効", "trap": "弁済したものとみなされ他の債務者も免責", "hook": "混同は弁済と同じ絶対効", "meta": "40% · corr+check"}, {"k": "特定物の弁済場所", "v": "債権発生時の所在場所", "trap": "債権者の現住所ではない", "hook": "特定物はいた場所で渡す", "meta": "50% · corr+check"}, {"k": "第三者弁済", "v": "原則有効", "trap": "『原則不可』は誤り。利害関係がないと債務者が拒否できる場合あり", "hook": "第三者でも原則払える", "meta": "50% · corr+check"}, {"k": "枝の切除", "v": "催告後に自ら可", "trap": "根は直ちに切り取り可。住家立入りは承諾必要", "hook": "枝は催告、根はすぐ、住家は承諾", "meta": "50% · review"}]}]}, {"id": "zei-weak", "field": "税その他（弱点）", "color": "zei", "blurb": "あなたの低正答率 · 税", "blocks": [{"title": "税率・納税義務（低正答）", "rows": [{"k": "不動産取得税（原則）", "v": "4%", "trap": "住宅・土地は特例3%", "hook": "原則4・住宅土地は3", "meta": "33–50% · corr+check"}, {"k": "新築住宅特例の床面積", "v": "50〜240㎡", "trap": "一戸建て以外の貸家は40〜240㎡", "hook": "貸家は40㎡から", "meta": "33% · corr+check"}, {"k": "行方不明時の固定資産税", "v": "使用者を所有者とみなす", "trap": "『所有者』と書いたままだと×", "hook": "行方不明は使用者", "meta": "33% · corr+check"}, {"k": "固定資産税の税率", "v": "標準1.4%", "trap": "条例で異なる税率も可", "hook": "1.4は標準・条例で変えられる", "meta": "50% · corr+check"}, {"k": "価格の据置き", "v": "原則3年", "trap": "地目変換・増改築等は時点修正あり", "hook": "3年据置き＋例外見直し", "meta": "50% · corr+check"}]}]}];

  const fields = [{ id: "all", label: "全部" }, ...DATA.map(d => ({ id: d.id, label: d.field.replace("（弱点）","").replace("上の","") }))];
  const modes = [
    { id: "all", label: "全部表示", cls: "mode" },
    { id: "nums", label: "数字だけ", cls: "mode" },
    { id: "traps", label: "ひっかけ", cls: "mode" }
  ];

  let field = "all";
  let mode = "all";
  let checks = {};
  try { checks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {}; } catch (e) { checks = {}; }

  const fieldChips = document.getElementById("fieldChips");
  const modeChips = document.getElementById("modeChips");
  const toc = document.getElementById("toc");
  const sections = document.getElementById("sections");
  const progBar = document.getElementById("progBar");
  const progText = document.getElementById("progText");

  function rowId(secId, bi, ri) { return secId + ":" + bi + ":" + ri; }
  function saveChecks() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(checks)); } catch (e) {} }
  function updateProgress() {
    const boxes = sections.querySelectorAll('input[type=checkbox]');
    const total = boxes.length;
    let done = 0;
    boxes.forEach(b => { if (b.checked) done++; });
    progBar.style.width = (total ? (done / total * 100) : 0) + "%";
    progText.textContent = done + " / " + total + " チェック";
  }
  function renderChips() {
    fieldChips.innerHTML = fields.map(f =>
      '<button type="button" class="chip' + (f.id === field ? " active" : "") + '" data-field="' + f.id + '">' + f.label + "</button>"
    ).join("");
    modeChips.innerHTML = modes.map(m =>
      '<button type="button" class="chip ' + m.cls + (m.id === mode ? " active" : "") + '" data-mode="' + m.id + '">' + m.label + "</button>"
    ).join("");
  }
  function render() {
    renderChips();
    toc.innerHTML = DATA.map(sec =>
      '<a class="' + sec.color + (field !== "all" && field !== sec.id ? " hidden" : "") + '" href="#' + sec.id + '">' +
      sec.field + "<span>" + sec.blurb + "</span></a>"
    ).join("");
    sections.className = mode === "nums" ? "nums-only" : (mode === "traps" ? "trap-only" : "");
    sections.innerHTML = DATA.map(sec => {
      const show = field === "all" || field === sec.id;
      const blocks = sec.blocks.map((b, bi) => {
        const rows = b.rows.map((r, ri) => {
          const id = rowId(sec.id, bi, ri);
          const done = !!checks[id];
          return (
            '<div class="row' + (done ? " done" : "") + (r.trap ? " has-trap" : "") + '">' +
              '<label class="check">' +
                '<input type="checkbox" data-id="' + id + '"' + (done ? " checked" : "") + "/>" +
                '<span class="k">' + esc(r.k) + "</span>" +
              "</label>" +
              '<span class="v">' + esc(r.v) + "</span>" +
              (r.trap ? '<div class="trap">' + esc(r.trap) + "</div>" : "") +
              (r.hook ? '<div class="hook">' + esc(r.hook) + "</div>" : "") +
              (r.meta ? '<div class="meta-line">正答率目安 ' + esc(r.meta) + "</div>" : "") +
            "</div>"
          );
        }).join("");
        return '<div class="block"><h3><span class="dot"></span>' + esc(b.title) + "</h3>" + rows + "</div>";
      }).join("");
      return (
        '<section class="sec' + (show ? " show" : "") + '" id="' + sec.id + '">' +
          '<div class="sec-head"><h2>' + esc(sec.field) + '</h2><span class="tag">' + esc(sec.blurb) + "</span></div>" +
          blocks +
        "</section>"
      );
    }).join("");
    updateProgress();
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }
  fieldChips.addEventListener("click", e => {
    const btn = e.target.closest("[data-field]");
    if (!btn) return;
    field = btn.getAttribute("data-field");
    render();
    if (field !== "all") {
      const el = document.getElementById(field);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    } else window.scrollTo({ top: 0, behavior: "smooth" });
  });
  modeChips.addEventListener("click", e => {
    const btn = e.target.closest("[data-mode]");
    if (!btn) return;
    mode = btn.getAttribute("data-mode");
    render();
  });
  sections.addEventListener("change", e => {
    const t = e.target;
    if (!t.matches('input[type=checkbox][data-id]')) return;
    const id = t.getAttribute("data-id");
    if (t.checked) checks[id] = 1; else delete checks[id];
    saveChecks();
    const row = t.closest(".row");
    if (row) row.classList.toggle("done", t.checked);
    updateProgress();
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm("今夜のチェックを全部消しますか？")) return;
    checks = {}; saveChecks(); render();
  });
  document.getElementById("topBtn").addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  render();
})();
</script>
