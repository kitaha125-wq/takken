<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宅建アプリ · バックアップセンター</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#faf7f2;color:#1a1a1a;padding:20px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto}
.card{background:#fff;border:2px solid #1a5ca8;padding:18px;margin-bottom:14px}
h1{font-size:18px;margin-bottom:6px}
.sub{font-size:12px;color:#666;margin-bottom:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat div{background:#faf7f2;border:1px solid #d4cfc4;padding:10px;font-size:11px}
.stat b{display:block;font-size:18px;margin-top:4px}
.btn{display:block;width:100%;padding:13px;border:none;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-main{background:#1a5ca8;color:#fff}
.btn-sub{background:#fff;color:#1a1a1a;border:2px solid #1a1a1a}
.btn-soft{background:#f0f4ff;color:#1a5ca8;border:2px solid #1a5ca8}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;min-width:140px}
textarea{width:100%;min-height:120px;padding:10px;border:1px solid #d4cfc4;font-family:monospace;font-size:11px;margin-top:8px}
.ok{color:#2d5016;font-weight:700;margin-top:12px;white-space:pre-wrap}
.err{color:#c8102e;font-weight:700;margin-top:12px;white-space:pre-wrap}
.preview{background:#f0f4ff;border:1px solid #b4c8e8;padding:12px;margin-top:12px;font-size:13px}
.snap{border-top:1px solid #d4cfc4;padding:10px 0;font-size:12px;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.mini{padding:7px 10px;font-size:11px;font-weight:800;border:1.5px solid #1a5ca8;background:#fff;color:#1a5ca8;cursor:pointer}
.mini.danger{border-color:#d4cfc4;color:#666}
a{color:#1a5ca8}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>💾 バックアップセンター</h1>
    <p class="sub">メインアプリが重いとき用の軽量ページです。進捗・弱点ノート・設定など <b>全 tk_* データ</b> を保存・復元できます。</p>
    <div class="stat" id="current"></div>
    <div class="row">
      <button class="btn btn-main" id="btnExport">⬇️ JSONを保存</button>
      <button class="btn btn-soft" id="btnCopy">📋 コピー</button>
      <button class="btn btn-sub" id="btnSnap">📱 端末に退避</button>
    </div>
    <div class="row">
      <button class="btn btn-sub" id="btnPick">📁 ファイルから復元</button>
      <button class="btn btn-soft" id="btnPaste">📝 貼り付けて復元</button>
    </div>
    <input type="file" id="file" accept=".json,application/json,text/plain,*/*" hidden>
    <div id="pasteBox" style="display:none">
      <textarea id="paste" placeholder='{"app":"takken-pwa","keys":{...}}'></textarea>
      <button class="btn btn-main" id="btnPasteGo">貼り付け内容を確認</button>
    </div>
    <div id="preview" class="preview" style="display:none"></div>
    <button class="btn btn-main" id="btnConfirm" style="display:none">この内容で復元する</button>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h1>端末内スナップショット</h1>
    <p class="sub">最大3件までこの端末に退避します。復元前にも自動で1件残します。</p>
    <div id="snaps"></div>
  </div>

  <div class="card">
    <h1>復元後に開くURL</h1>
    <p class="sub">同じブラウザで開いてください（初回は読み込みに時間がかかることがあります）。</p>
    <p><a href="https://classy-kleicha-030356.netlify.app/index.html">Netlify（いつものURL）</a></p>
    <p style="margin-top:8px"><a href="./index.html">このサイトの index.html</a></p>
    <p style="margin-top:12px;font-size:12px;color:#666"><a href="./start.html">接続テスト</a> · <a href="./weakness-daily.html">弱点ノート振り返り</a></p>
  </div>
</div>
<script>
const KNOWN_KEYS = [
  'tk_done_v5','tk_days_v5','tk_schedule_v1','tk_plan_start_v1','tk_plan_daily_min_v1',
  'tk_srs_v1','tk_hist_v5','tk_activity_v1','tk_daily_journal_v1','tk_last_visit_v1',
  'tk_notify_v1','tk_review_count_v1','tk_gemini_notes_v1','tk_chatgpt_notes_v1','tk_ai_quiz_v1',
  'tk_career_vision_v1','tk_tracker_filter_v1','tk_tracker_collapsed_v1','tk_tracker_sort_v1',
  'tk_docs_collapsed_v1','tk_q_edits_v1','tk_seen_version',
  'tk_question_corrections_v1','tk_question_review_notes_v1','tk_daily_question_goal_v1',
  'tk_daily_question_count_v1','tk_review_exclusions_v1','tk_weakness_daily_checks_v1',
];
const SNAP_KEY = 'tk_backup_snapshots_v1';
const SNAP_MAX = 3;
let pending = null;

function coerce(v){
  if (v == null) return null;
  if (typeof v === 'string') {
    const t = v.trim();
    if (!t) return null;
    try { return JSON.parse(t); } catch { return v; }
  }
  return v;
}
function normalize(raw){
  if (typeof raw === 'string') {
    const text = raw.trim().replace(/^\uFEFF/, '');
    if (!text || text.startsWith('%PDF')) throw new Error('PDFは使えません。JSONを選んでください');
    try { raw = JSON.parse(text); } catch { throw new Error('JSONの形式が正しくありません'); }
  }
  const keys = raw.keys && typeof raw.keys === 'object' ? raw.keys : raw;
  if (!keys || typeof keys !== 'object' || Array.isArray(keys)) throw new Error('バックアップにデータがありません');
  return keys;
}
function summarize(keys){
  const pick = k => coerce(keys[k]);
  const done = pick('tk_done_v5');
  const days = pick('tk_days_v5');
  const srs = pick('tk_srs_v1');
  const hist = pick('tk_hist_v5');
  const notes = pick('tk_question_review_notes_v1');
  return {
    keyCount: Object.keys(keys).filter(k => k.startsWith('tk_') && k !== SNAP_KEY).length,
    lectures: Array.isArray(done) ? done.length : 0,
    planDays: Array.isArray(days) ? days.length : 0,
    srsCount: srs && typeof srs === 'object' && !Array.isArray(srs) ? Object.keys(srs).length : 0,
    quizSessions: Array.isArray(hist) ? hist.length : 0,
    reviewNotes: notes && typeof notes === 'object' && !Array.isArray(notes) ? Object.keys(notes).length : 0,
  };
}
function collectKeys(){
  const keys = {};
  const seen = new Set();
  KNOWN_KEYS.forEach(k => {
    try {
      const raw = localStorage.getItem(k);
      if (raw !== null) { keys[k] = JSON.parse(raw); seen.add(k); }
    } catch {}
  });
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith('tk_') || k === SNAP_KEY || seen.has(k)) continue;
    try {
      const raw = localStorage.getItem(k);
      if (raw !== null) keys[k] = JSON.parse(raw);
    } catch {}
  }
  return keys;
}
function makePayload(){
  return {
    app: 'takken-pwa',
    version: 'backup-center',
    exportedAt: new Date().toISOString(),
    keys: collectKeys(),
  };
}
function loadSnaps(){
  try {
    const v = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch { return []; }
}
function saveSnap(label, payload){
  const p = payload || makePayload();
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    label: label || '手動退避',
    savedAt: new Date().toISOString(),
    summary: summarize(p.keys || {}),
    payload: p,
  };
  const next = [entry, ...loadSnaps().filter(x => x && x.payload)].slice(0, SNAP_MAX);
  try {
    localStorage.setItem(SNAP_KEY, JSON.stringify(next));
  } catch (e) {
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(next.slice(0, 1))); }
    catch { throw new Error('端末内退避の容量が足りません。JSON保存を使ってください'); }
  }
  return entry;
}
function deleteSnap(id){
  localStorage.setItem(SNAP_KEY, JSON.stringify(loadSnaps().filter(x => x.id !== id)));
}
function importKeys(payload){
  const keys = normalize(payload);
  const summary = summarize(keys);
  if (summary.keyCount === 0) throw new Error('tk_データがありません');
  if (!summary.lectures && !summary.planDays && !summary.srsCount && !summary.quizSessions && !summary.reviewNotes) {
    throw new Error('バックアップが空です');
  }
  try { saveSnap('復元前の自動退避'); } catch {}
  let count = 0;
  Object.entries(keys).forEach(([k, v]) => {
    if (!k.startsWith('tk_') || k === SNAP_KEY) return;
    const val = coerce(v);
    if (val == null) return;
    localStorage.setItem(k, JSON.stringify(val));
    count++;
  });
  if (!count) throw new Error('復元できませんでした');
  return { count, summary };
}
function renderCurrent(){
  const s = summarize(collectKeys());
  document.getElementById('current').innerHTML = [
    '<div>今の講義<b>' + s.lectures + '</b></div>',
    '<div>計画日<b>' + s.planDays + '</b></div>',
    '<div>問題記録<b>' + s.srsCount + '</b></div>',
    '<div>弱点ノート<b>' + s.reviewNotes + '</b></div>',
  ].join('');
}
function renderSnaps(){
  const list = loadSnaps();
  const el = document.getElementById('snaps');
  if (!list.length) {
    el.innerHTML = '<p class="sub" style="margin:0">まだ退避はありません。</p>';
    return;
  }
  el.innerHTML = list.map(s => {
    const when = new Date(s.savedAt).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    const sum = s.summary || {};
    return '<div class="snap"><div><b>' + s.label + '</b> · ' + when +
      '<br><span style="color:#666">講義' + (sum.lectures||0) + '・問題' + (sum.srsCount||0) + '・弱点' + (sum.reviewNotes||0) + '</span></div>' +
      '<div><button class="mini" data-restore="' + s.id + '">復元</button> ' +
      '<button class="mini danger" data-del="' + s.id + '">削除</button></div></div>';
  }).join('');
  el.querySelectorAll('[data-restore]').forEach(btn => {
    btn.onclick = () => {
      const snap = loadSnaps().find(x => x.id === btn.dataset.restore);
      if (!snap) return;
      try {
        const r = importKeys(snap.payload);
        renderCurrent(); renderSnaps();
        showMsg('✅ スナップショットから復元しました（' + r.count + '項目）。下のURLからアプリを開いてください。', true);
      } catch (ex) { showMsg(ex.message, false); }
    };
  });
  el.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => { deleteSnap(btn.dataset.del); renderSnaps(); };
  });
}
function showPreview(name, summary){
  const el = document.getElementById('preview');
  el.style.display = 'block';
  el.innerHTML = '<b>📂 ' + name + '</b><br>講義 ' + summary.lectures +
    '・計画 ' + summary.planDays + '・問題 ' + summary.srsCount +
    '・弱点ノート ' + summary.reviewNotes + '（' + summary.keyCount + '項目）';
  document.getElementById('btnConfirm').style.display = 'block';
}
function showMsg(text, ok){
  const el = document.getElementById('msg');
  el.className = ok ? 'ok' : 'err';
  el.textContent = text || '';
}
function downloadJson(){
  const payload = makePayload();
  try { saveSnap('ダウンロード時', payload); } catch {}
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'takken-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  return summarize(payload.keys || {});
}

document.getElementById('btnExport').onclick = () => {
  try {
    const s = downloadJson();
    renderSnaps();
    showMsg('⬇️ 保存しました（講義' + s.lectures + '・問題' + s.srsCount + '・弱点' + s.reviewNotes + '）', true);
  } catch (ex) { showMsg(ex.message, false); }
};
document.getElementById('btnCopy').onclick = async () => {
  try {
    const payload = makePayload();
    const text = JSON.stringify(payload, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
    else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    try { saveSnap('コピー時', payload); } catch {}
    renderSnaps();
    showMsg('📋 クリップボードにコピーしました', true);
  } catch (ex) { showMsg(ex.message, false); }
};
document.getElementById('btnSnap').onclick = () => {
  try {
    saveSnap('手動退避');
    renderSnaps();
    showMsg('📱 この端末に退避しました', true);
  } catch (ex) { showMsg(ex.message, false); }
};
document.getElementById('btnPick').onclick = () => document.getElementById('file').click();
document.getElementById('btnPaste').onclick = () => {
  const b = document.getElementById('pasteBox');
  b.style.display = b.style.display === 'none' ? 'block' : 'none';
};
document.getElementById('file').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    pending = await f.text();
    showPreview(f.name, summarize(normalize(pending)));
    showMsg('', true);
  } catch (ex) { showMsg(ex.message, false); pending = null; }
  e.target.value = '';
};
document.getElementById('btnPasteGo').onclick = () => {
  try {
    pending = document.getElementById('paste').value;
    showPreview('貼り付けJSON', summarize(normalize(pending)));
    showMsg('', true);
  } catch (ex) { showMsg(ex.message, false); pending = null; }
};
document.getElementById('btnConfirm').onclick = () => {
  if (!pending) return;
  try {
    const r = importKeys(pending);
    renderCurrent(); renderSnaps();
    showMsg('✅ 復元しました（' + r.count + '項目）。下のURLからメインアプリを開いてください。', true);
    document.getElementById('preview').style.display = 'none';
    document.getElementById('btnConfirm').style.display = 'none';
    pending = null;
  } catch (ex) { showMsg(ex.message, false); }
};

renderCurrent();
renderSnaps();
</script>
</body>
</html>
