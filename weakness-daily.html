<style>

bel":"日","cats":["権利関係（基礎）","抵当権","債権・担保責任"],"focus":"権利関係横断（時効・抵当・保証）"}],"pdfNotes":44};

const CHECK_KEY = 'tk_weakness_daily_checks_v1';

function todayIndex() {
  // Mon=0 ... Sun=6  (Japan-ish weekday)
  const d = new Date();
  const w = (d.getDay() + 6) % 7; // Mon=0
  return w;
}

function loadChecks() {
  try { return JSON.parse(localStorage.getItem(CHECK_KEY) || '{}'); } catch { return {}; }
}
function saveChecks(v) { localStorage.setItem(CHECK_KEY, JSON.stringify(v)); }

function dayKey() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function getTodayChecks() {
  const all = loadChecks();
  const k = dayKey();
  if (!all[k]) all[k] = {};
  return { all, today: all[k], k };
}

function catByName(name) {
  return DATA.categories.find(c => c.cat === name);
}

function renderItem(item, id, checks) {
  const checked = !!checks[id];
  const wrong = item.wasWrong ? ' wrong' : '';
  const kws = (item.keywords || []).map(k => `<span>${escapeHtml(k)}</span>`).join('');
  let cmp = '';
  if (item.comparisonTable && item.comparisonTable.length) {
    const rows = item.comparisonTable.map(r => `
      <tr>
        <td>${escapeHtml(r.condition || '')}</td>
        <td>${escapeHtml(r.rule || '')}</td>
        <td class="num">${escapeHtml(String(r.number || ''))}</td>
        <td class="attn">${escapeHtml(r.attention || '')}</td>
      </tr>`).join('');
    cmp = `
      <details>
        <summary>比較表を見る${item.comparisonTitle ? '（' + escapeHtml(item.comparisonTitle) + '）' : ''}</summary>
        <div class="cmp">
          <table>
            <thead><tr><th>条件</th><th>ルール</th><th>数字</th><th>ひっかけ</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </details>`;
  }
  return `
    <div class="item${wrong}" data-id="${id}">
      <label class="checklist" style="border:0;padding:0 0 8px">
        <input type="checkbox" data-check="${id}" ${checked ? 'checked' : ''}/>
        <div>
          <p class="wp">${escapeHtml(item.weakPoint || '')}${item.source==='pdf' ? '<span class="src src-pdf">まとめ</span>' : '<span class="src src-weak">弱点</span>'}${checked ? ' <span class="done-mark">✓</span>' : ''}</p>
          <div class="hook">${escapeHtml(item.memoryHook || '')}</div>
          <div class="kw">${kws}</div>
          ${cmp}
        </div>
      </label>
    </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderDaily(checks) {
  const idx = todayIndex();
  const today = DATA.daily[idx];
  let html = `<div class="day-card" id="day-${idx}">
      <h2>▶ ${today.label}曜日コース（今日）</h2>
      <p class="focus">フォーカス：${escapeHtml(today.focus)}</p>
      <div>${today.cats.map(c => `<span class="pill">${escapeHtml(c)}</span>`).join('')}</div>
    </div>
    <p class="focus">記憶フックを声に出してチェック。迷ったら比較表を開く。</p>`;

  today.cats.forEach(catName => {
    const cat = catByName(catName);
    if (!cat) return;
    html += `<div class="sec-title"><h2>${escapeHtml(cat.cat)}</h2><span class="meta">誤答 ${cat.wrong} / ${cat.count}</span></div>`;
    cat.items.forEach((item, j) => {
      const id = `today:${catName}:${j}`;
      html += renderItem(item, id, checks);
    });
  });

  html += `<details style="margin-top:18px"><summary>週のローテ一覧を見る</summary>`;
  DATA.daily.forEach((day, i) => {
    const isToday = i === idx;
    html += `<div class="day-card" style="opacity:${isToday ? 1 : .75}">
      <h2 style="font-size:.95rem">${isToday ? '▶ ' : ''}${day.label}曜日 · ${escapeHtml(day.focus)}</h2>
      <div>${day.cats.map(c => `<span class="pill">${escapeHtml(c)}</span>`).join('')}</div>
    </div>`;
  });
  html += `</details>`;
  return html;
}

function renderCategory(cat, checks) {
  let html = `<div class="sec-title"><h2>${escapeHtml(cat.cat)}</h2>
    <span class="meta">${escapeHtml(cat.field)} · 誤答 ${cat.wrong}/${cat.count}</span></div>
    <p class="focus">記憶フックを声に出してから、比較表で数字を確認。</p>`;
  cat.items.forEach((item, j) => {
    html += renderItem(item, `c:${cat.cat}:${j}`, checks);
  });
  return html;
}

function updateProgress() {
  const { today } = getTodayChecks();
  const boxes = [...document.querySelectorAll('input[data-check]')];
  // only count visible panel
  const visible = boxes.filter(b => b.closest('.panel.active'));
  const done = visible.filter(b => b.checked).length;
  const total = visible.length || 1;
  document.getElementById('progBar').style.width = Math.round(done/total*100) + '%';
  document.getElementById('headerSub').textContent =
    `チェック ${done}/${visible.length} · 弱点${DATA.categories.filter(c=>c.source!=='pdf').reduce((a,c)=>a+c.count,0)}＋まとめ${DATA.pdfNotes||0}＝${DATA.totalNotes}件`;
}

function bindChecks() {
  document.querySelectorAll('input[data-check]').forEach(inp => {
    inp.addEventListener('change', () => {
      const { all, today, k } = getTodayChecks();
      today[inp.dataset.check] = inp.checked;
      all[k] = today;
      saveChecks(all);
      // refresh done mark without full re-render
      updateProgress();
    });
  });
}

function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.panel === name));
  updateProgress();
  if (name === 'daily') {
    const el = document.getElementById('day-' + todayIndex());
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function boot() {
  const { today } = getTodayChecks();
  const tabs = document.getElementById('tabs');
  const main = document.getElementById('main');

  const short = (c) => c.cat
    .replace(/^宅建業法（(.+)）$/, '$1')
    .replace('用途地域（13種）', '用途地域')
    .replace('都市計画法（まとめ）', '都計まとめ')
    .replace('権利関係（基礎）', '権利基礎')
    .replace('債権・担保責任', '債権・担保')
    .replace('宅建業法（まとめ）', '業法まとめ');
  const fields = ['すべて','弱点','宅建業法','法令上の制限','権利関係','税その他'];
  const fieldTabs = document.getElementById('fieldTabs');
  let fieldFilter = 'すべて';

  function catsForFilter() {
    if (fieldFilter === 'すべて') return DATA.categories;
    if (fieldFilter === '弱点') return DATA.categories.filter(c => c.source !== 'pdf');
    return DATA.categories.filter(c => c.field === fieldFilter || (fieldFilter==='権利関係' && (c.field==='権利関係'||c.cat==='債権総論')));
  }

  function renderTabs(activePanel) {
    const tabDefs = [
      { id: 'daily', label: '今日のローテ' },
      ...catsForFilter().map(c => ({ id: 'cat:' + c.cat, label: short(c) })),
    ];
    tabs.innerHTML = tabDefs.map(t =>
      `<button class="tab${t.id===activePanel?' active':''}" type="button" data-panel="${t.id}">${t.label}</button>`
    ).join('');
    tabs.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showPanel(t.dataset.panel)));
  }

  fieldTabs.innerHTML = fields.map(f =>
    `<button class="ftab${f==='すべて'?' active':''}" type="button" data-field="${f}">${f}</button>`
  ).join('');
  fieldTabs.querySelectorAll('.ftab').forEach(btn => btn.addEventListener('click', () => {
    fieldFilter = btn.dataset.field;
    fieldTabs.querySelectorAll('.ftab').forEach(b => b.classList.toggle('active', b===btn));
    const cur = document.querySelector('.tab.active')?.dataset.panel || 'daily';
    renderTabs(cur.startsWith('cat:') && !catsForFilter().some(c => 'cat:'+c.cat === cur) ? 'daily' : cur);
    if (cur.startsWith('cat:') && !catsForFilter().some(c => 'cat:'+c.cat === cur)) showPanel('daily');
  }));

  renderTabs('daily');

  let panels = `<section class="panel active" data-panel="daily">${renderDaily(today)}</section>`;
  DATA.categories.forEach(cat => {
    panels += `<section class="panel" data-panel="cat:${cat.cat}">${renderCategory(cat, today)}</section>`;
  });
  main.innerHTML = panels;

  document.getElementById('btnToday').onclick = () => showPanel('daily');
  document.getElementById('btnReset').onclick = () => {
    const { all, k } = getTodayChecks();
    all[k] = {};
    saveChecks(all);
    boot();
    showPanel(document.querySelector('.tab.active')?.dataset.panel || 'daily');
  };
  bindChecks();
  updateProgress();
}

boot();
</script>
